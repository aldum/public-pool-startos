id: pubpool
title: PublicPool
version: 0.0.1
release-notes: test build
license: MIT
wrapper-repo: "https://github.com/aldum/pubpool-startos"
upstream-repo: "https://github.com/benjamin-wilson/public-pool"
support-site: "https://github.com/benjamin-wilson/public-pool/issues"
marketing-site: "https://github.com/benjamin-wilson/public-pool"

build: ["make"]

description:
  short: "A Nestjs and Typescript Bitcoin stratum mining server"
  long: ""

assets:
  license: LICENSE
  icon: logo.png
  instructions: instructions.md

main:
  type: docker
  image: main
  entrypoint: docker_entrypoint.sh
  args: []
  mounts:
    main: /data/.public-pool
  io-format: yaml

health-checks: {}

config:
  get:
    type: script
  set:
    type: script

dependencies:
  bitcoind:
    version: ">=0.21.1.2 <28.0.0"
    requirement:
      type: "required"
    description: Used for interfacing with the network
    config:
      check:
        type: script
      auto-configure:
        type: script

volumes:
  main:
    type: data

interfaces:
  stratum:
    name: Stratum
    description: Stratum interface
    tor-config:
      port-mapping:
        3333: "3333"
        3334: "3334"
    lan-config:
      3333:
        ssl: false
        internal: 3333
      3334:
        ssl: false
        internal: 3334
    ui: false
    protocols:
      - tcp
      - http
      - json-rpc

backup:
  create:
    type: docker
    image: compat
    system: true
    entrypoint: compat
    args:
      - duplicity
      - create
      - /mnt/backup
      - /data/.public-pool
    mounts:
      BACKUP: /mnt/backup
      main: /data/.public-pool
  restore:
    type: docker
    image: compat
    system: true
    entrypoint: compat
    args:
      - duplicity
      - restore
      - /mnt/backup
      - /data/.public-pool
    mounts:
      BACKUP: /mnt/backup
      main: /data/.public-pool
