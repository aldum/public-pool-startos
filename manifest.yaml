id: pubpool
title: PublicPool
version: 0.0.3
release-notes: test build
license: MIT
wrapper-repo: "https://github.com/aldum/pubpool-startos"
upstream-repo: "https://github.com/benjamin-wilson/public-pool"
support-site: "https://github.com/benjamin-wilson/public-pool/issues"
marketing-site: "https://github.com/benjamin-wilson/public-pool"

build: ["make"]

description:
  short: "A Nestjs and Typescript Bitcoin stratum mining server"
  long: ""

assets:
  license: LICENSE
  icon: logo.png
  instructions: instructions.md

main:
  type: docker
  image: main
  entrypoint: docker_entrypoint.sh
  args: []
  mounts:
    main: /data/.public-pool
    db: /DB
  io-format: yaml

health-checks: {}

config:
  get:
    type: script
  set:
    type: script

dependencies:
  bitcoind:
    version: ">=0.21.1.2 <28.0.0"
    requirement:
      type: "required"
    description: Used for interfacing with the bitcoin network
    config:
      check:
        type: script
      auto-configure:
        type: script

volumes:
  main:
    type: data
  db:
    type: data

interfaces:
  public-pool:
    name: Public pool
    description: Web UI and stratum interface
    tor-config:
      port-mapping:
        3333: "3333"
        80: "80"
    # it's lying about the address, until that's sorted out, disabled
    # lan-config:
    #   443:
    #     ssl: true
    #     internal: 80
    ui: true
    protocols:
      - tcp
      - http
      - json-rpc
      - stratum

backup:
  create:
    type: docker
    image: compat
    system: true
    entrypoint: compat
    args:
      - duplicity
      - create
      - /mnt/backup
      - /DB
    mounts:
      BACKUP: /mnt/backup
      db: /DB
  restore:
    type: docker
    image: compat
    system: true
    entrypoint: compat
    args:
      - duplicity
      - restore
      - /mnt/backup
      - /DB
    mounts:
      BACKUP: /mnt/backup
      db: /DB
